# DSH 0.1.7 reserved the name `auto` for its own Auto integration (full access with
# approval off), so DSCODE's reviewed preset — workspace writes with every eligible
# approval request reviewed by a model, human fallback intact — is named `auto-review`.
- id: permission
  config:
    defaultPreset: auto-review
    presets:
      auto-review:
        sandbox: workspace-write
        approval: ask
        name: Auto review
        description: Workspace writes; automatic review of eligible approval requests, with human fallback.
      ask:
        sandbox: workspace-write
        approval: ask
        name: Ask me
      workspace-write:
        sandbox: workspace-write
        approval: ask
      read-only:
        sandbox: read-only
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

