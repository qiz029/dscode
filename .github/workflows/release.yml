name: Release

# Tag pushes publish; a manual run only builds and verifies unless asked to publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to npm and the Hub
        type: boolean
        default: false
      verify_credentials:
        description: Only check the npm and Hub credentials and stop (implies the publish job)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the tag to match the manifest version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      # Same reason checks.yml provisions: the unit suite asserts the patched runtime that
      # `npm run setup` writes into node_modules, and nothing else applies it.
      - run: npm run setup
      - run: npm run check
      - name: Build the release candidates
        env:
          DSCODE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm run build:packages
          npm run release:hub
          npm run dist
      - run: npm run verify:hub
      # One tarball keeps the exact layout: upload-artifact roots the archive at the
      # least common ancestor of its paths, which silently dropped the `artifacts/`
      # prefix and left the publish job without bundle-pack.json.
      - name: Pack the verified artifacts for the publish job
        run: tar -czf release-candidates.tar.gz artifacts/npm artifacts/local/hub-verification.json artifacts/dscode-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          if-no-files-found: error
          path: release-candidates.tar.gz

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish || inputs.verify_credentials
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
      - name: Restore the verified artifacts
        run: |
          tar -xzf release-candidates.tar.gz
          test -f artifacts/npm/bundle-pack.json || { echo "::error::the release candidate archive is incomplete"; exit 1; }
          test -f artifacts/local/hub-verification.json || { echo "::error::the hub verification record is missing"; exit 1; }
      # Read-only: both tokens authenticate and this version is still free. A manual
      # dispatch with verify_credentials stops here.
      - name: Check the publishing credentials
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          DSH_HUB_TOKEN: ${{ secrets.DSH_HUB_TOKEN }}
        run: |
          test -n "$NPM_PUBLISH_TOKEN" || { echo "::error::add the NPM_PUBLISH_TOKEN secret (granular npm token with bypass 2FA for @toddzheng024/dscode and @toddzheng024/dscode-bundle)"; exit 1; }
          test -n "$DSH_HUB_TOKEN" || { echo "::error::add the DSH_HUB_TOKEN secret (Hub CI token)"; exit 1; }
          node scripts/check-publish-credentials.mjs
      # Never publish the launcher before its Hub release resolves: the three
      # phases each re-check the artifact hashes they verified above.
      - name: Publish the bundle to npm
        if: github.ref_type == 'tag' || inputs.publish
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm run publish:hub -- bundle
      - name: Sync npm and publish the Hub profile
        if: github.ref_type == 'tag' || inputs.publish
        env:
          DSH_HUB_TOKEN: ${{ secrets.DSH_HUB_TOKEN }}
        run: npm run publish:hub -- profile
      - name: Publish the launcher to npm
        if: github.ref_type == 'tag' || inputs.publish
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm run publish:hub -- launcher
      # The curl installer, `dscode update` and the README all fetch these tarballs from
      # the release: the prebuilt ones install without npm, the source one is the fallback.
      - name: Attach the release tarballs to the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          set -- "artifacts/dscode-$version.tar.gz" "artifacts/dscode-$version-darwin-arm64.tar.gz" "artifacts/dscode-$version-darwin-x64.tar.gz"
          for tarball in "$@"; do
            test -f "$tarball" || { echo "::error::missing $tarball"; exit 1; }
          done
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$@" --clobber
          else
            gh release create "v$version" "$@" --title "DSCODE $version" --notes-file "docs/releases/$version.md"
          fi
