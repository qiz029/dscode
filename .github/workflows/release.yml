name: Release

# Tag pushes publish; a manual run only builds and verifies unless asked to publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified self-contained packages and the Desktop plugin
        type: boolean
        default: false
      verify_credentials:
        description: Only check the npm and Hub credentials and stop (implies the publish job)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the tag to match the manifest version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      # Same reason checks.yml provisions: the unit suite asserts the patched runtime that
      # `npm run setup` writes into node_modules, and nothing else applies it.
      - run: npm run setup
      - run: npm run check
      - name: Build the self-contained release candidates
        run: |
          npm run dist
          node scripts/homebrew-formula.mjs
      - run: node scripts/verify-standalone.mjs
      # One tarball keeps the exact layout: upload-artifact roots the archive at the
      # least common ancestor of its paths, which silently dropped the `artifacts/`
      # prefix and left the publish job without the expected artifact paths.
      - name: Pack the verified artifacts for the publish job
        run: tar -czf release-candidates.tar.gz artifacts/dscode-*.tar.gz artifacts/dscode-*.sha256 artifacts/dscode.rb artifacts/local/standalone-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          if-no-files-found: error
          path: release-candidates.tar.gz

  verify-intel:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
      - run: tar -xzf release-candidates.tar.gz
      - run: node scripts/verify-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-intel-verification
          path: artifacts/local/standalone-darwin-x64.json

  # Linux packages are cross-built on macOS (no install scripts run) and qualified on
  # native runners, the same way the Intel macOS candidate is.
  verify-linux:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
      - run: tar -xzf release-candidates.tar.gz
      - run: node scripts/verify-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.runner }}-verification
          path: artifacts/local/standalone-linux-*.json

  publish-terminal:
    needs: [build, verify-intel, verify-linux]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
      - run: tar -xzf release-candidates.tar.gz
      - name: Publish the same complete packages used by installers and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "docs/releases/$version.md"
          set -- "artifacts/dscode-$version-darwin-arm64-standalone.tar.gz" "artifacts/dscode-$version-darwin-x64-standalone.tar.gz" \
            "artifacts/dscode-$version-linux-x64-standalone.tar.gz" "artifacts/dscode-$version-linux-arm64-standalone.tar.gz" artifacts/dscode-*.sha256 artifacts/dscode.rb
          for file in "$@"; do test -f "$file"; done
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$@" --clobber
          else
            gh release create "v$version" "$@" --title "DSCODE $version" --notes-file "docs/releases/$version.md"
          fi

  desktop:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:desktop
      - name: Qualify the exact public Desktop tarball
        env:
          DSCODE_TEST_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          test -x "$DSCODE_TEST_CHROME"
          npm run release:desktop -- .research/desktop-release-runtime
      - run: tar -czf desktop-candidate.tar.gz artifacts/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate
          if-no-files-found: error
          path: desktop-candidate.tar.gz

  publish-desktop:
    needs: [desktop, publish-terminal]
    if: always() && needs.desktop.result == 'success' && (needs.publish-terminal.result == 'success' || inputs.verify_credentials)
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: desktop-candidate
      - name: Restore and check the Desktop candidate
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          DSH_HUB_TOKEN: ${{ secrets.DSH_HUB_TOKEN }}
        run: |
          tar -xzf desktop-candidate.tar.gz
          npm run publish:desktop -- credentials
      - name: Publish the qualified Desktop plugin and verify public discovery
        if: github.ref_type == 'tag' || inputs.publish
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          DSH_HUB_TOKEN: ${{ secrets.DSH_HUB_TOKEN }}
        run: |
          npm run publish:desktop -- npm
          npm run publish:desktop -- hub
          npm run publish:desktop -- verify
          npm run publish:desktop -- promote
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || inputs.publish
        with:
          name: desktop-public-verification
          if-no-files-found: error
          path: artifacts/local/desktop-public-install.json
      - name: Attach Desktop assets to the existing release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" artifacts/desktop/release/*.tgz artifacts/desktop/release/*.sha256 artifacts/desktop/release/*-README.md artifacts/desktop/release/*-release-notes.md --clobber
