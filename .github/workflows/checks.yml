name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Checks run against the provisioned runtime: `npm run setup` applies patchInkFrame and
      # patchRuntime to node_modules, and ink is not vendored into the bundle, so a checkout
      # that skips this step fails tests/ink-frame.test.mjs with "the composer rode up".
      - run: npm run setup
      - run: npm run check
      - name: Real Chrome and native browser tools
        run: npm run test:browser
      - name: Browser evaluation pipeline (scripted, no model score)
        run: npm run eval:browser -- --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-node-${{ matrix.node }}
          path: |
            artifacts/local/coverage/
            artifacts/local/browser-eval-*/
